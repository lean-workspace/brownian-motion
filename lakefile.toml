name = "workspace"

# Companion workspace for RemyDegenne/brownian-motion: the Lean code stays
# upstream and is brought in as a pinned dependency (the "depend on it" path in
# docs/tutorial/quick-start/work-on-external-project.md). Blueprint chapters
# under content/blueprint/ are markdown reference chapters whose items carry
# lean="..." pointing at upstream declarations.
#
# No defaultTargets: the dependency is not a root-package target. Build its
# modules explicitly, one +Module per blueprint.config.json lakeRoots entry:
#   lake exe cache get         # prebuilt mathlib (transitive via kolmogorov_extension4)
#   lake build +BrownianMotion

[[require]]
name = "BrownianMotion"
git = "https://github.com/RemyDegenne/brownian-motion"
rev = "bdf5ea0c34f9e6d75bce5f0609a968d6e9e99e8e"

[[lean_exe]]
name = "blueprint-data"
srcDir = "scripts/blueprint-data"
root = "BlueprintData"
supportInterpreter = true
